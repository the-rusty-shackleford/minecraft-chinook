# No Java: a helicopter for Rotorcraft is two datapack entries, its meshes and a sound.
modLoader="lowcodefml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/the-rusty-shackleford/minecraft-chinook/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Rusty Shackleford, nfx"
description='''
The Chinook: a life-size Boeing CH-47 for Rotorcraft. Two rotors in tandem,
a pilot, a copilot and twelve aboard, a rear ramp for six grown animals and
two chests, four wheels; a hook for a sling load; a mount for a fifteen-block
crop sprayer. Built on the Mechanic Lift, dyeable, and flown with Space and
Shift like every rotorcraft.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The rotorcraft protocol, nested in this jar, with Vanilla Wheels nested in it.
[[dependencies.${mod_id}]]
    modId="rotorcraft"
    type="required"
    versionRange="[1.0.0,2.0)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="vanillawheels"
    type="required"
    versionRange="[1.12.0,2.0)"
    ordering="AFTER"
    side="BOTH"
